# ClinAssist AI - three SEPARATE simulated source systems on three DIFFERENT database engines,
# the way a real hospital, an outside laboratory and a pharmacy chain would run them:
#
#   hospital-db    Microsoft SQL Server 2022   port 55432   database hospital_ehr
#   laboratory-db  MySQL 8.4                   port 55433   database lab_lis
#   pharmacy-db    PostgreSQL 16               port 55434   database pharmacy_rx
#
# They share nothing: different engines, ports, credentials and schemas. Each has an admin account
# (used only to load the data) and a separate READ-ONLY account that Zetaris uses.
# Zetaris federates them; the agent never connects to them directly.
#
# Start (from this folder):   docker compose up -d        (first start loads the data: 1-3 minutes)
# Check:                      docker compose ps            (all three should say "healthy")
# Stop, keep data:            docker compose stop
# Rebuild from CSVs:          docker compose down -v   then   docker compose up -d
#
# Data comes from ..\data\derived (run clinassist_build_sources.py first). Synthetic data only.
# SQL Server needs about 2 GB of RAM in Docker.

name: clinassist-sources

services:
  hospital-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${HOSPITAL_ADMIN_PASSWORD:?set HOSPITAL_ADMIN_PASSWORD in sources/.env}
      HOSPITAL_DB_USER: ${HOSPITAL_DB_USER:-hospital_ro}
      HOSPITAL_DB_PASSWORD: ${HOSPITAL_DB_PASSWORD:?set HOSPITAL_DB_PASSWORD in sources/.env}
    entrypoint: ["/bin/bash", "/init/start.sh"]
    ports: ["127.0.0.1:55432:1433"]
    volumes:
      - ../data/derived/hospital:/data:ro
      - ./init/sqlserver:/init:ro
      - hospital-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "S=/opt/mssql-tools18/bin/sqlcmd; F=-C; [ -x $$S ] || { S=/opt/mssql-tools/bin/sqlcmd; F=; }; $$S $$F -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -h -1 -Q \"SET NOCOUNT ON; IF OBJECT_ID('master.dbo.clinassist_load_complete') IS NULL RAISERROR('loading', 16, 1)\""]
      interval: 10s
      retries: 60
      start_period: 30s

  laboratory-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lab_lis
      MYSQL_ROOT_PASSWORD: ${LAB_ADMIN_PASSWORD:?set LAB_ADMIN_PASSWORD in sources/.env}
      LAB_DB_USER: ${LAB_DB_USER:-lab_ro}
      LAB_DB_PASSWORD: ${LAB_DB_PASSWORD:?set LAB_DB_PASSWORD in sources/.env}
    ports: ["127.0.0.1:55433:3306"]
    volumes:
      - ../data/derived/laboratory:/csv:ro
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
      - laboratory-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -N -e \"SELECT COUNT(*) FROM mysql.user WHERE user='$$LAB_DB_USER'\" | grep -qx 1"]
      interval: 10s
      retries: 60
      start_period: 30s

  pharmacy-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmacy_rx
      POSTGRES_USER: ${PHARMACY_ADMIN_USER:-pharmacy_admin}
      POSTGRES_PASSWORD: ${PHARMACY_ADMIN_PASSWORD:?set PHARMACY_ADMIN_PASSWORD in sources/.env}
      PHARMACY_DB_USER: ${PHARMACY_DB_USER:-pharmacy_ro}
      PHARMACY_DB_PASSWORD: ${PHARMACY_DB_PASSWORD:?set PHARMACY_DB_PASSWORD in sources/.env}
    ports: ["127.0.0.1:55434:5432"]
    volumes:
      - ../data/derived/pharmacy:/data:ro
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
      - pharmacy-pg:/var/lib/postgresql/data
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pharmacy_rx"], interval: 5s, retries: 30}

volumes:
  hospital-mssql:
  laboratory-mysql:
  pharmacy-pg:
